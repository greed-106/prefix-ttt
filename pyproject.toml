[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-ttt"
version = "0.1.0"
description = "Token-prefix test-time training in the original LLaVA framework"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "triton==3.3.1",
  "transformers==4.51.3", "peft==0.15.2", "accelerate==1.6.0",
  "safetensors>=0.5,<0.6", "sentencepiece==0.2.0", "protobuf>=4,<6",
  "numpy>=1.26,<2", "pillow>=10,<12", "einops>=0.8,<0.9",
  "shortuuid", "requests", "ijson", "pyarrow>=19,<20",
  "flash-linear-attention",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pypdf>=6,<7"]
eval = ["lmms-eval==0.7.2", "datasets==4.0.0"]

[tool.setuptools.packages.find]
where = ["src", "third_party/llava"]
include = ["prefix_ttt*", "llava*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires a CUDA device and validated GPU environment"]

[tool.uv]
default-groups = ["dev", "eval"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-linear-attention = { git = "https://github.com/fla-org/flash-linear-attention.git", rev = "c51953382397da5c3b7b8a41e568915b703e2934" }
