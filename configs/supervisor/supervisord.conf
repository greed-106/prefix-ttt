; Supervisor host for the P32 long runs.
;
; The manager is independent of any terminal or agent session, which is what the
; project's execution policy requires for formal training. Programs are explicit
; argv lists with absolute paths and an explicit environment: supervisord does not
; read .bashrc or .profile, so PATH, CUDA_VISIBLE_DEVICES and the output root must
; be stated here rather than inherited.
;
;   /data/mjyang/.pixi/bin/supervisord -c configs/supervisor/supervisord.conf
;   /data/mjyang/.pixi/bin/supervisorctl -c configs/supervisor/supervisord.conf status
;   /data/mjyang/.pixi/bin/supervisorctl -c configs/supervisor/supervisord.conf start p32-b
;
; autostart=false / autorestart=false / startretries=0: a failed run stays failed
; and is inspected before anything is restarted, so no run is silently repeated.

[unix_http_server]
file=/var/tmp/prefix-ttt-1000/supervisor.sock
chmod=0600

[supervisord]
logfile=/var/tmp/prefix-ttt-1000/supervisord.log
pidfile=/var/tmp/prefix-ttt-1000/supervisord.pid
childlogdir=/var/tmp/prefix-ttt-1000
loglevel=info
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/tmp/prefix-ttt-1000/supervisor.sock

[program:p32-a]
command=/data/mjyang/code/llm/prefix-ttt/scripts/experiments/prefix_ttt_p32/launch_a.sh 0
directory=/data/mjyang/code/llm/prefix-ttt
autostart=false
autorestart=false
startretries=0
startsecs=30
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/tmp/prefix-ttt-1000/p32-a.log
environment=PATH="/data/mjyang/.local/bin:/data/mjyang/.pixi/bin:/usr/local/bin:/usr/bin:/bin",UV="/data/mjyang/.local/bin/uv",CUDA_VISIBLE_DEVICES="4,5,6,7",NNODES="2",GPUS="4",NODE_RANK="0",MASTER_HOST="h100-3",MASTER_PORT="29597",OUT="/data/shared/weights/prefix-ttt/training/A-P32-r2",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"

[program:p32-b]
command=/data/mjyang/code/llm/prefix-ttt/scripts/experiments/prefix_ttt_p32/launch_b.sh 0
directory=/data/mjyang/code/llm/prefix-ttt
autostart=false
autorestart=false
startretries=0
startsecs=30
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/tmp/prefix-ttt-1000/p32-b.log
environment=PATH="/data/mjyang/.local/bin:/data/mjyang/.pixi/bin:/usr/local/bin:/usr/bin:/bin",UV="/data/mjyang/.local/bin/uv",CUDA_VISIBLE_DEVICES="4,5,6,7",NNODES="2",GPUS="4",NODE_RANK="0",MASTER_HOST="h100-3",MASTER_PORT="29598",OUT="/data/shared/weights/prefix-ttt/training/P32-r2",STAGE_A="/data/shared/weights/prefix-ttt/training/A-P32-r2/latest.pt",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
