[unix_http_server]
file=/var/tmp/prefix-ttt-1000/supervisor.sock
chmod=0600

[supervisord]
logfile=/var/tmp/prefix-ttt-1000/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/tmp/prefix-ttt-1000/supervisord.pid
childlogdir=/var/tmp/prefix-ttt-1000
umask=0077
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/tmp/prefix-ttt-1000/supervisor.sock

[program:prefix-ttt-queue]
directory=/data/ymj/code/llm/prefix-ttt
command=/data/ymj/.pixi/bin/uv run --locked --no-sync python -m prefix_ttt.scheduler --manifest /data/ymj/code/llm/prefix-ttt/configs/jobs-e2-resume.json --database /var/tmp/prefix-ttt-1000/queue-e2-resume.sqlite3 --gpu-ids 0,1,2,3
; No formal manifest yet. Start explicitly only after manifest/data/GPU checks.
autostart=false
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/tmp/prefix-ttt-1000/consumer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=HOME="/data/ymj",PATH="/usr/local/cuda-12.8/bin:/data/ymj/.pixi/bin:/usr/local/bin:/usr/bin:/bin",CUDA_HOME="/usr/local/cuda-12.8",LD_LIBRARY_PATH="/usr/local/cuda-12.8/lib64",CUDA_VISIBLE_DEVICES="0,1,2,3",CPATH="/data/ymj/code/llm/prefix-ttt/artifacts/gpu/python-dev/usr/include/python3.10:/data/ymj/code/llm/prefix-ttt/artifacts/gpu/python-dev/usr/include",HF_ENDPOINT="https://hf-mirror.com",HF_HOME="/data/ymj/.cache/huggingface",HF_HUB_OFFLINE="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",PREFIX_TTT_QUEUE_ROOT="/var/tmp/prefix-ttt-1000"
