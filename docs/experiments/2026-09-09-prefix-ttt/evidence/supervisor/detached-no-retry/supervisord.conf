[unix_http_server]
file=/var/tmp/prefix-ttt-supervisor-test-dn9cg1x2/control.sock
chmod=0600
[supervisord]
logfile=/var/tmp/prefix-ttt-supervisor-test-dn9cg1x2/supervisord.log
pidfile=/var/tmp/prefix-ttt-supervisor-test-dn9cg1x2/supervisord.pid
childlogdir=/var/tmp/prefix-ttt-supervisor-test-dn9cg1x2
nodaemon=false
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///var/tmp/prefix-ttt-supervisor-test-dn9cg1x2/control.sock
[program:queue]
command=/data/ymj/.pixi/bin/uv run --locked --no-sync python -m prefix_ttt.scheduler --manifest /var/tmp/prefix-ttt-supervisor-test-dn9cg1x2/manifest.json --database /var/tmp/prefix-ttt-supervisor-test-dn9cg1x2/queue.sqlite3 --gpu-ids 0,1,2,3 --poll-seconds 0.1
directory=/data/ymj/code/llm/prefix-ttt
autostart=false
